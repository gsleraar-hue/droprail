# Let GitHub build Droprail.
#
# You do not need a Mac of your own: GitHub has them. This workflow builds the
# .dmg (Apple Silicon and Intel) on a Mac runner and the installer on a Windows
# runner, and a third job hangs everything on one release.
#
# Two ways to start it:
#   - by hand, through the Actions tab -> Build -> Run workflow
#   - by pushing a version tag:  git tag v0.2.0 && git push origin v0.2.0
#
# The macOS app is ad-hoc signed, not notarised (that needs an Apple account at
# $99 a year). On first launch: right-click the app, then Open.

name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac
            command: npm run dist-mac
            files: |
              dist/*.dmg
              dist/*.zip
          - os: windows-latest
            name: windows
            command: npm run dist
            files: |
              dist/*.exe

    runs-on: ${{ matrix.os }}

    env:
      # With no Apple certificate there is nothing to sign with. Leave this out
      # and electron-builder goes looking for one anyway, and the build dies.
      CSC_IDENTITY_AUTO_DISCOVERY: false
      # A failed build must not drown in progress bars.
      npm_config_progress: false

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: What is running here?
        shell: bash
        run: |
          echo "node: $(node --version)"
          echo "npm:  $(npm --version)"
          echo "os:   $RUNNER_OS"

      # Electron itself (over 100 MB per architecture) comes from a server that
      # hands out the odd 504. Whatever was fetched once stays here.
      - uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Fetch packages
        run: npm install --no-audit --no-fund

      - name: Redraw the icons
        run: npm run icon

      # One of these cases downloads a real image, so a hiccup at the other end
      # would otherwise block a release. It still shows up red in the log.
      - name: Check the saving logic
        continue-on-error: true
        run: npm run selftest

      # If the download stalls halfway (it happens), try again - up to three times.
      - name: Build
        shell: bash
        run: |
          for attempt in 1 2 3; do
            ${{ matrix.command }} && exit 0
            echo "attempt $attempt stalled - waiting, then trying again"
            sleep 30
          done
          exit 1

      - name: What came out?
        if: always()
        shell: bash
        run: ls -la dist/ || echo "no dist folder"

      # Even if the build stalls halfway: whatever is there, you can download.
      # Otherwise you are left empty-handed while half of it may have been done.
      - name: Keep as a download
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: droprail-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: warn

  # One job puts everything on the release. Letting both build jobs publish
  # would race: each creates the release if it is not there yet, and you end up
  # with two releases carrying half the files each.
  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Collect the builds
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: What are we publishing?
        run: ls -laR artifacts

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          draft: false
          generate_release_notes: true
